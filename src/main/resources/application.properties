
spring.application.name=myschool-multischool-platform

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/myschool_platform}
spring.datasource.username=root
spring.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server
server.port=8081
server.error.include-stacktrace=never
server.error.include-message=never

# Logging
logging.level.root=INFO
logging.file.name=logs/myschool-platform.log

# Actuator - expose only health initially
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

# Application information
info.app.name=MySchool Multi-School Platform
info.app.version=1.0.0

